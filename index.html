<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>workout-diary</title>
    <!-- Google Fonts 手写 & 宋体风格 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e8e0d8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 16px;
        }

        /* ===== 手机容器 ===== */
        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 820px;
            background: #f7f2eb;
            border-radius: 48px;
            box-shadow: 0 30px 80px rgba(60, 50, 40, 0.25), 0 0 0 1px rgba(255, 248, 240, 0.3) inset;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ===== 印象派油画背景肌理 ===== */
        .oil-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 20% 10%, rgba(169, 214, 229, 0.30) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 30%, rgba(183, 224, 210, 0.25) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 70%, rgba(240, 201, 216, 0.20) 0%, transparent 50%),
                radial-gradient(ellipse at 10% 90%, rgba(210, 190, 170, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 90% 80%, rgba(200, 215, 200, 0.20) 0%, transparent 40%),
                linear-gradient(160deg, #f5efe8 0%, #efe8df 40%, #eae2d7 100%);
            opacity: 0.7;
        }
        .oil-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(45deg, transparent, transparent 120px, rgba(255, 248, 240, 0.08) 120px, rgba(255, 248, 240, 0.08) 121px),
                repeating-linear-gradient(-45deg, transparent, transparent 140px, rgba(200, 185, 170, 0.05) 140px, rgba(200, 185, 170, 0.05) 141px);
            pointer-events: none;
        }

        /* ===== 滚动内容 ===== */
        .scroll-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 100px 20px;
            position: relative;
            z-index: 1;
            scroll-behavior: smooth;
        }
        .scroll-content::-webkit-scrollbar {
            width: 3px;
        }
        .scroll-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .scroll-content::-webkit-scrollbar-thumb {
            background: rgba(180, 170, 160, 0.4);
            border-radius: 10px;
        }

        /* ===== 顶部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(180, 170, 160, 0.2);
            margin-bottom: 16px;
        }
        .header-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .header-left .title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #2B4450;
            letter-spacing: 1px;
            line-height: 1.1;
        }
        .header-left .subtitle {
            font-family: 'Caveat', cursive;
            font-size: 18px;
            color: #6a7b7a;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }
        .header-right .date {
            font-size: 13px;
            font-weight: 400;
            color: #6a7b7a;
            letter-spacing: 0.3px;
        }
        .header-right .weather {
            font-size: 20px;
            font-weight: 400;
            color: #4a6a6a;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-right .weather span {
            font-size: 13px;
            font-weight: 300;
            color: #6a7b7a;
        }
        .header-right .mood {
            font-family: 'Caveat', cursive;
            font-size: 16px;
            color: #8a7a7a;
            margin-top: 2px;
        }

        /* ===== 卡片通用 ===== */
        .card {
            background: rgba(255, 252, 248, 0.65);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 24px;
            padding: 18px 18px 20px;
            box-shadow: 0 6px 28px rgba(140, 120, 100, 0.08), 0 1px 4px rgba(255, 248, 240, 0.6) inset;
            border: 1px solid rgba(255, 248, 240, 0.5);
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        /* ===== 当前训练区域 ===== */
        .workout-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .workout-header h2 {
            font-size: 17px;
            font-weight: 600;
            color: #2B4450;
            letter-spacing: 0.5px;
        }
        .workout-header .draft-badge {
            font-size: 11px;
            color: #7a9a8a;
            background: rgba(183, 224, 210, 0.35);
            padding: 3px 12px;
            border-radius: 30px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .workout-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }
        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
            background: rgba(200, 190, 180, 0.2);
            color: #3a4a4a;
            border: 1px solid rgba(180, 170, 160, 0.15);
        }
        .btn-primary {
            background: #2B4450;
            color: #fcf8f0;
            border: none;
            box-shadow: 0 4px 14px rgba(43, 68, 80, 0.20);
        }
        .btn-primary:hover {
            background: #1f3a45;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(43, 68, 80, 0.25);
        }
        .btn-secondary {
            background: rgba(230, 220, 210, 0.5);
            color: #4a5a5a;
            border: 1px solid rgba(180, 170, 160, 0.2);
        }
        .btn-secondary:hover {
            background: rgba(210, 200, 190, 0.5);
        }
        .btn-accent {
            background: #E79BAE;
            color: #fcf8f0;
            border: none;
            box-shadow: 0 4px 14px rgba(231, 155, 174, 0.25);
        }
        .btn-accent:hover {
            background: #d88a9e;
            transform: translateY(-1px);
        }
        .btn-sm {
            padding: 5px 14px;
            font-size: 12px;
            border-radius: 30px;
        }
        .btn-xs {
            padding: 3px 10px;
            font-size: 11px;
            border-radius: 20px;
        }
        .btn-danger {
            background: rgba(200, 120, 120, 0.15);
            color: #a06060;
            border: 1px solid rgba(200, 120, 120, 0.2);
        }
        .btn-danger:hover {
            background: rgba(200, 120, 120, 0.25);
        }
        .btn-delete-history {
            background: none;
            border: none;
            color: #c0a0a0;
            font-size: 16px;
            cursor: pointer;
            padding: 0 6px;
            transition: color 0.2s;
            line-height: 1;
        }
        .btn-delete-history:hover {
            color: #a06060;
        }

        /* ===== 概览 ===== */
        .overview {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 252, 248, 0.4);
            border-radius: 16px;
            padding: 12px 8px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 248, 240, 0.3);
        }
        .overview-item {
            text-align: center;
        }
        .overview-item .num {
            font-size: 22px;
            font-weight: 600;
            color: #2B4450;
            display: block;
            line-height: 1.2;
        }
        .overview-item .label {
            font-size: 11px;
            color: #7a8a8a;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .overview-item .num .unit {
            font-size: 13px;
            font-weight: 400;
            color: #7a8a8a;
            margin-left: 2px;
        }

        /* ===== 动作列表 ===== */
        .exercise-group {
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(180, 170, 160, 0.12);
            padding-bottom: 14px;
        }
        .exercise-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .exercise-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .exercise-name {
            font-size: 16px;
            font-weight: 600;
            color: #2B4450;
            letter-spacing: 0.3px;
            font-family: 'Playfair Display', serif;
        }
        .exercise-name .custom-badge {
            font-size: 10px;
            font-weight: 400;
            color: #7a9a8a;
            background: rgba(183, 224, 210, 0.25);
            padding: 1px 10px;
            border-radius: 30px;
            margin-left: 8px;
            font-family: 'Inter', sans-serif;
        }
        .exercise-actions {
            display: flex;
            gap: 6px;
        }
        .exercise-actions .btn {
            padding: 3px 10px;
            font-size: 11px;
            border-radius: 20px;
        }

        /* ===== Set 行 ===== */
        .set-row {
            display: grid;
            grid-template-columns: 40px 1fr 1fr 1fr 36px;
            gap: 6px;
            align-items: center;
            padding: 5px 4px;
            border-radius: 10px;
            background: rgba(255, 252, 248, 0.3);
            margin-bottom: 4px;
            transition: background 0.15s;
        }
        .set-row:hover {
            background: rgba(255, 252, 248, 0.6);
        }
        .set-row .set-num {
            font-size: 12px;
            font-weight: 500;
            color: #8a9a9a;
            text-align: center;
        }
        .set-row input {
            background: transparent;
            border: none;
            border-bottom: 1.5px solid rgba(180, 170, 160, 0.2);
            padding: 4px 2px;
            font-size: 14px;
            font-weight: 400;
            color: #2B4450;
            width: 100%;
            text-align: center;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
            outline: none;
        }
        .set-row input:focus {
            border-bottom-color: #2B4450;
        }
        .set-row input::placeholder {
            color: #b0b0b0;
            font-size: 11px;
            font-weight: 300;
        }
        .set-row .set-weight-input {
            position: relative;
        }
        .set-row .set-weight-input .unit-label {
            position: absolute;
            right: 2px;
            bottom: 4px;
            font-size: 10px;
            color: #9aaa9a;
            font-weight: 400;
        }
        .set-row .set-reps-input {
            position: relative;
        }
        .set-row .set-reps-input .reps-label {
            position: absolute;
            right: 2px;
            bottom: 4px;
            font-size: 10px;
            color: #9aaa9a;
            font-weight: 400;
        }
        .set-row .btn-del-set {
            background: none;
            border: none;
            color: #c0b0b0;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            line-height: 1;
            transition: all 0.2s;
        }
        .set-row .btn-del-set:hover {
            color: #a06060;
            background: rgba(200, 120, 120, 0.1);
        }

        .add-set-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 12px;
            color: #6a8a8a;
            background: rgba(200, 215, 200, 0.15);
            border: 1px dashed rgba(180, 170, 160, 0.25);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 6px;
            width: fit-content;
            font-family: 'Inter', sans-serif;
        }
        .add-set-btn:hover {
            background: rgba(200, 215, 200, 0.3);
            border-color: rgba(180, 170, 160, 0.4);
        }

        /* ===== 备注 ===== */
        .workout-note {
            margin-top: 12px;
        }
        .workout-note input {
            width: 100%;
            background: rgba(255, 252, 248, 0.4);
            border: 1px solid rgba(180, 170, 160, 0.15);
            border-radius: 30px;
            padding: 10px 16px;
            font-size: 13px;
            color: #3a4a4a;
            outline: none;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }
        .workout-note input:focus {
            border-color: rgba(43, 68, 80, 0.3);
        }
        .workout-note input::placeholder {
            color: #b0b0b0;
            font-weight: 300;
        }

        /* ===== 完成按钮 ===== */
        .complete-section {
            margin-top: 6px;
            display: flex;
            gap: 12px;
        }
        .complete-section .btn {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border-radius: 40px;
        }

        /* ===== 最近训练 ===== */
        .history-title {
            font-size: 16px;
            font-weight: 600;
            color: #2B4450;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-title .more {
            font-size: 12px;
            font-weight: 400;
            color: #8a9a9a;
            cursor: pointer;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255, 252, 248, 0.35);
            border-radius: 16px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 248, 240, 0.2);
            transition: all 0.15s;
            cursor: default;
        }
        .history-item .clickable {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .history-item:hover {
            background: rgba(255, 252, 248, 0.55);
        }
        .history-item .left .h-name {
            font-size: 14px;
            font-weight: 500;
            color: #2B4450;
        }
        .history-item .left .h-date {
            font-size: 11px;
            color: #8a9a9a;
            margin-top: 2px;
        }
        .history-item .right {
            text-align: right;
        }
        .history-item .right .h-volume {
            font-size: 16px;
            font-weight: 600;
            color: #2B4450;
        }
        .history-item .right .h-volume .unit {
            font-size: 11px;
            font-weight: 400;
            color: #8a9a9a;
        }
        .history-item .right .h-detail {
            font-size: 11px;
            color: #8a9a9a;
        }
        .history-item .delete-wrapper {
            margin-left: 8px;
        }

        /* ===== 底部导航 ===== */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: rgba(255, 252, 248, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 248, 240, 0.4);
            display: flex;
            justify-content: space-around;
            padding: 10px 12px 18px;
            border-radius: 0 0 48px 48px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            color: #8a9a9a;
            font-size: 10px;
            font-weight: 400;
            transition: color 0.2s;
            padding: 4px 12px;
            border-radius: 30px;
            background: transparent;
            border: none;
            font-family: 'Inter', sans-serif;
        }
        .nav-item .nav-icon {
            font-size: 22px;
            line-height: 1.2;
        }
        .nav-item.active {
            color: #2B4450;
            font-weight: 500;
        }
        .nav-item.active .nav-icon {
            color: #2B4450;
        }
        .nav-item:hover {
            color: #2B4450;
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(40, 35, 30, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 50;
            display: none;
            align-items: flex-end;
            justify-content: center;
            border-radius: 48px;
            overflow: hidden;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-sheet {
            background: #f7f2eb;
            border-radius: 32px 32px 0 0;
            padding: 24px 20px 30px;
            width: 100%;
            max-height: 80%;
            overflow-y: auto;
            box-shadow: 0 -10px 40px rgba(40, 35, 30, 0.15);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-sheet .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(180, 170, 160, 0.3);
            border-radius: 10px;
            margin: 0 auto 16px;
        }
        .modal-sheet h3 {
            font-size: 19px;
            font-weight: 600;
            color: #2B4450;
            margin-bottom: 14px;
            font-family: 'Playfair Display', serif;
        }
        .modal-sheet .modal-close {
            float: right;
            background: none;
            border: none;
            font-size: 24px;
            color: #8a9a9a;
            cursor: pointer;
            padding: 0 4px;
        }
        .modal-sheet .form-group {
            margin-bottom: 14px;
        }
        .modal-sheet .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: #3a4a4a;
            display: block;
            margin-bottom: 4px;
        }
        .modal-sheet .form-group input,
        .modal-sheet .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(180, 170, 160, 0.2);
            border-radius: 30px;
            font-size: 14px;
            background: rgba(255, 252, 248, 0.5);
            outline: none;
            font-family: 'Inter', sans-serif;
            color: #2B4450;
            transition: border-color 0.2s;
        }
        .modal-sheet .form-group input:focus,
        .modal-sheet .form-group select:focus {
            border-color: rgba(43, 68, 80, 0.4);
        }
        .modal-sheet .form-group .hint {
            font-size: 11px;
            color: #8a9a9a;
            margin-top: 4px;
        }
        .modal-sheet .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .modal-sheet .btn-group .btn {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            font-size: 15px;
        }
        .modal-sheet .action-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .modal-sheet .action-list .action-item {
            padding: 12px 16px;
            border-radius: 16px;
            background: rgba(255, 252, 248, 0.3);
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 248, 240, 0.1);
        }
        .modal-sheet .action-list .action-item:hover {
            background: rgba(255, 252, 248, 0.6);
        }
        .modal-sheet .action-list .action-item .name {
            font-size: 14px;
            color: #2B4450;
        }
        .modal-sheet .action-list .action-item .tag {
            font-size: 11px;
            color: #8a9a9a;
            background: rgba(200, 215, 200, 0.2);
            padding: 2px 12px;
            border-radius: 30px;
        }

        /* ===== Toast ===== */
        .toast {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(43, 68, 80, 0.92);
            backdrop-filter: blur(8px);
            color: #fcf8f0;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 400;
            z-index: 60;
            opacity: 0;
            transition: all 0.35s ease;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            font-family: 'Inter', sans-serif;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 20px 10px;
            color: #8a9a9a;
        }
        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 8px;
            opacity: 0.5;
        }
        .empty-state .text {
            font-size: 14px;
            font-weight: 400;
        }

        /* ===== 工具类 ===== */
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gap-6 {
            gap: 6px;
        }
        .text-center {
            text-align: center;
        }
        .w-full {
            width: 100%;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 440px) {
            body {
                padding: 0;
                background: #f7f2eb;
            }
            .phone-frame {
                border-radius: 0;
                max-width: 100%;
                height: 100vh;
                box-shadow: none;
            }
            .bottom-nav {
                border-radius: 0;
            }
            .modal-overlay {
                border-radius: 0;
            }
        }

        /* ===== 滚动条隐藏 ===== */
        .scroll-content {
            scrollbar-width: thin;
        }

        /* ===== 复用历史列表 ===== */
        .history-select-item {
            padding: 10px 14px;
            background: rgba(255, 252, 248, 0.3);
            border-radius: 14px;
            margin-bottom: 6px;
            cursor: pointer;
            border: 1px solid rgba(255, 248, 240, 0.1);
            transition: all 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-select-item:hover {
            background: rgba(255, 252, 248, 0.6);
        }
        .history-select-item .hs-name {
            font-weight: 500;
            color: #2B4450;
            font-size: 14px;
        }
        .history-select-item .hs-date {
            font-size: 12px;
            color: #8a9a9a;
        }
        .history-select-item .hs-detail {
            font-size: 12px;
            color: #8a9a9a;
        }
        .history-select-item .delete-wrapper {
            margin-left: 8px;
        }

        /* 自定义动作标记 */
        .custom-tag {
            font-size: 10px;
            background: rgba(231, 155, 174, 0.2);
            color: #b07a8a;
            padding: 1px 10px;
            border-radius: 30px;
            margin-left: 6px;
        }

        /* 历史项删除按钮在弹窗中 */
        .btn-delete-history-sm {
            background: none;
            border: none;
            color: #c0a0a0;
            font-size: 14px;
            cursor: pointer;
            padding: 0 6px;
            transition: color 0.2s;
            line-height: 1;
        }
        .btn-delete-history-sm:hover {
            color: #a06060;
        }
    </style>
</head>
<body>

        <!-- Toast -->

                <div class="header-right">
                    <div class="date" id="currentDate">2026-08-26</div>
                    <div class="weather">☀️ <span>26°C</span></div>
                    <div class="mood">✦ Good day!</div>
                </div>

            <!-- ===== 当前训练 ===== -->
            <div class="card" id="workoutCard">
                <div class="workout-header">
                    <h2>📋 当前训练</h2>

                <div class="workout-actions">
                    <button class="btn btn-primary" id="btnAddExercise">＋ 添加动作</button>

                <!-- 概览 -->
                <div class="overview" id="overview">
                    <div class="overview-item">
                        <span class="num" id="exerciseCount">0</span>

                    <div class="overview-item">

                        <span class="label">组数</span>
                    </div>
                    <div class="overview-item">

                <!-- 动作列表 -->
                <div id="exerciseList">

                </div>

                <!-- 完成 -->
                <div class="complete-section mt-12">

            <!-- ===== 最近训练 ===== -->
            <div class="card" id="historyCard">
                <div class="history-title">
                    <span>📖 最近训练</span>
                    <span class="more" id="btnViewAll">查看全部 →</span>
                </div>
                <div id="historyList">
                    <!-- 动态渲染 -->
                </div>
            </div>

            <!-- 底部占位 -->
            <div style="height: 20px;"></div>
        </div>

        <!-- ===== 底部导航 ===== -->
        <div class="bottom-nav">
            <button class="nav-item active" data-tab="workout">
                <span class="nav-icon">🏋️</span>
                训练
            </button>
            <button class="nav-item" data-tab="library">
                <span class="nav-icon">📚</span>
                动作库
            </button>
            <button class="nav-item" data-tab="stats">
                <span class="nav-icon">📊</span>
                数据统计
            </button>
            <button class="nav-item" data-tab="settings">
                <span class="nav-icon">⚙️</span>
                设置
            </button>
        </div>

        <!-- ===== 弹窗：添加动作 ===== -->
        <div class="modal-overlay" id="modalAddExercise">
            <div class="modal-sheet">
                <div class="modal-handle"></div>
                <button class="modal-close" id="modalCloseAdd">✕</button>
                <h3>➕ 添加动作</h3>

                <div class="form-group">
                    <input type="text" id="searchExercise" placeholder="搜索动作…" />
                </div>

                <div style="margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn btn-sm btn-secondary" id="filterRecent">最近使用</button>
                    <button class="btn btn-sm btn-secondary" id="filterAll">全部</button>
                    <button class="btn btn-sm btn-primary" id="btnCreateNewAction">＋ 创建自定义</button>
                </div>

                <div id="exercisePickerList" style="max-height: 300px; overflow-y: auto;">
                    <!-- 动态 -->
                </div>
            </div>
        </div>

        <!-- ===== 弹窗：创建自定义动作 ===== -->
        <div class="modal-overlay" id="modalCreateExercise">
            <div class="modal-sheet">
                <div class="modal-handle"></div>
                <button class="modal-close" id="modalCloseCreate">✕</button>
                <h3>✏️ 创建自定义动作</h3>
                <div class="form-group">
                    <label>动作名称</label>
                    <input type="text" id="newExerciseName" placeholder="例如：单臂绳索高位下拉" />
                    <div class="hint">输入你训练中使用的任何动作名称</div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-secondary" id="btnCancelCreate">取消</button>
                    <button class="btn btn-primary" id="btnSaveCreate">保存</button>
                </div>
            </div>
        </div>

        <!-- ===== 弹窗：复用历史 ===== -->
        <div class="modal-overlay" id="modalReuse">
            <div class="modal-sheet">
                <div class="modal-handle"></div>
                <button class="modal-close" id="modalCloseReuse">✕</button>
                <h3>↻ 复用历史训练</h3>
                <p style="color:#8a9a9a; font-size:13px; margin-bottom:14px;">选择一次历史训练，复制其动作和组数</p>
                <div id="reuseHistoryList">
                    <!-- 动态 -->
                </div>
            </div>
        </div>

        <!-- ===== 弹窗：全部历史 ===== -->
        <div class="modal-overlay" id="modalAllHistory">
            <div class="modal-sheet">
                <div class="modal-handle"></div>
                <button class="modal-close" id="modalCloseAllHistory">✕</button>
                <h3>📖 全部训练记录</h3>
                <div id="allHistoryList">
                    <!-- 动态 -->
                </div>
            </div>
        </div>

        <!-- ===== 弹窗：训练详情 ===== -->
        <div class="modal-overlay" id="modalWorkoutDetail">
            <div class="modal-sheet">
                <div class="modal-handle"></div>
                <button class="modal-close" id="modalCloseDetail">✕</button>
                <h3 id="detailTitle">训练详情</h3>
                <div id="detailContent" style="font-size:14px; color:#3a4a4a; line-height:1.7;">
                    <!-- 动态 -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        //  workout-diary — 完整 JavaScript 应用
        // ============================================================

        // ---------- 数据 ----------
        const STORAGE_KEY = 'workoutDiaryData';

        // 默认数据结构
        function getDefaultData() {
            return {
                exercises: [], // { id, name, isCustom, createdAt }
                workouts: [], // { id, date, startedAt, completedAt, note, exercises: [ { exerciseId, exerciseName, isCustom, sets: [ { setNumber, weight, weightUnit, reps, note } ] } ] }
                currentDraft: null, // 同 workout 结构，但未完成
                settings: { weightUnit: 'kg' }
            };
        }

        let data = loadData();
        let currentWorkout = data.currentDraft || createEmptyWorkout();
        let editingExerciseId = null; // 用于编辑时定位

        // ---------- 工具 ----------
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    // 合并默认值
                    const def = getDefaultData();
                    for (let key in def) {
                        if (!(key in parsed)) parsed[key] = def[key];
                    }
                    return parsed;
                }
            } catch (e) { /* ignore */ }
            return getDefaultData();
        }

        function saveData() {
            data.currentDraft = currentWorkout;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function createEmptyWorkout() {
            return {
                id: generateId(),
                date: new Date().toISOString().slice(0, 10),
                startedAt: new Date().toISOString(),
                completedAt: null,
                note: '',
                exercises: []
            };
        }

        function getExerciseName(id) {
            const found = data.exercises.find(e => e.id === id);
            return found ? found.name : '未知动作';
        }

        function getExerciseIdByName(name) {
            const found = data.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
            return found ? found.id : null;
        }

        function ensureExercise(name, isCustom = false) {
            const existing = data.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
            if (existing) return existing.id;
            const id = generateId();
            data.exercises.push({ id, name, isCustom, createdAt: new Date().toISOString() });
            saveData();
            return id;
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
        }

        function formatTime(dateStr) {
            const d = new Date(dateStr);
            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function getWeekday(dateStr) {
            const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            return days[new Date(dateStr).getDay()];
        }

        function calcVolume(workout) {
            let total = 0;
            (workout.exercises || []).forEach(ex => {
                (ex.sets || []).forEach(set => {
                    const w = parseFloat(set.weight) || 0;
                    const r = parseInt(set.reps) || 0;
                    total += w * r;
                });
            });
            return total;
        }

        function totalSets(workout) {
            let count = 0;
            (workout.exercises || []).forEach(ex => {
                count += (ex.sets || []).length;
            });
            return count;
        }

        // ---------- 删除历史训练 ----------
        function deleteWorkout(id) {
            if (!confirm('确定要删除这条训练记录吗？此操作不可撤销。')) return;
            const index = data.workouts.findIndex(w => w.id === id);
            if (index === -1) return;
            data.workouts.splice(index, 1);
            saveData();
            renderHistory();
            // 如果全部历史弹窗打开，刷新其内容
            const allModal = document.getElementById('modalAllHistory');
            if (allModal.classList.contains('show')) {
                renderAllHistory();
            }
            showToast('已删除训练记录');
        }

        // ---------- 渲染：当前训练 ----------
        function renderWorkout() {
            const container = document.getElementById('exerciseList');
            const exCount = currentWorkout.exercises.length;
            let setCount = 0;
            let volume = 0;

            if (exCount === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🏋️</div>
                        <div class="text">还没有动作，开始添加吧</div>
                    </div>
                `;
            } else {
                let html = '';
                currentWorkout.exercises.forEach((ex, exIdx) => {
                    const sets = ex.sets || [];
                    setCount += sets.length;
                    sets.forEach(s => {
                        const w = parseFloat(s.weight) || 0;
                        const r = parseInt(s.reps) || 0;
                        volume += w * r;
                    });

                    html += `
                        <div class="exercise-group" data-exidx="${exIdx}">
                            <div class="exercise-head">
                                <span class="exercise-name">
                                    ${ex.exerciseName}
                                    ${ex.isCustom ? '<span class="custom-badge">✧ 自定义</span>' : ''}
                                </span>
                                <div class="exercise-actions">
                                    <button class="btn btn-sm btn-danger" data-action="delete-exercise" data-exidx="${exIdx}">删除</button>
                                </div>
                            </div>
                            <div class="sets-container" data-exidx="${exIdx}">
                    `;

                    sets.forEach((set, setIdx) => {
                        const weightVal = set.weight || '';
                        const repsVal = set.reps || '';
                        html += `
                            <div class="set-row" data-exidx="${exIdx}" data-setidx="${setIdx}">
                                <span class="set-num">${set.setNumber || setIdx+1}</span>
                                <div class="set-weight-input">
                                    <input type="number" step="0.5" class="set-weight" value="${weightVal}" placeholder="重量" data-exidx="${exIdx}" data-setidx="${setIdx}" />
                                    <span class="unit-label">${data.settings.weightUnit || 'kg'}</span>
                                </div>
                                <div class="set-reps-input">
                                    <input type="number" step="1" class="set-reps" value="${repsVal}" placeholder="次数" data-exidx="${exIdx}" data-setidx="${setIdx}" />
                                    <span class="reps-label">次</span>
                                </div>
                                <div></div>
                                <button class="btn-del-set" data-action="delete-set" data-exidx="${exIdx}" data-setidx="${setIdx}">✕</button>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                            <button class="add-set-btn" data-action="add-set" data-exidx="${exIdx}">＋ 添加一组</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            // 更新概览
            document.getElementById('exerciseCount').textContent = exCount;
            document.getElementById('setCount').textContent = setCount;
            document.getElementById('totalVolume').innerHTML = `${Math.round(volume)} <span class="unit">kg</span>`;

            // 更新备注
            document.getElementById('workoutNote').value = currentWorkout.note || '';

            // 绑定事件
            bindWorkoutEvents();
            saveData();
        }

        // ---------- 绑定事件 ----------
        function bindWorkoutEvents() {
            // 删除动作
            document.querySelectorAll('[data-action="delete-exercise"]').forEach(btn => {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.dataset.exidx);
                    if (confirm(`确定要删除「${currentWorkout.exercises[idx].exerciseName}」及其所有组吗？`)) {
                        currentWorkout.exercises.splice(idx, 1);
                        renderWorkout();
                        showToast('已删除动作');
                    }
                };
            });

            // 删除组
            document.querySelectorAll('[data-action="delete-set"]').forEach(btn => {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    const exIdx = parseInt(this.dataset.exidx);
                    const setIdx = parseInt(this.dataset.setidx);
                    const ex = currentWorkout.exercises[exIdx];
                    if (!ex) return;
                    if (ex.sets.length <= 1) {
                        showToast('至少保留一组');
                        return;
                    }
                    ex.sets.splice(setIdx, 1);
                    // 重新编号
                    ex.sets.forEach((s, i) => s.setNumber = i + 1);
                    renderWorkout();
                    showToast('已删除组');
                };
            });

            // 添加组
            document.querySelectorAll('[data-action="add-set"]').forEach(btn => {
                btn.onclick = function() {
                    const exIdx = parseInt(this.dataset.exidx);
                    const ex = currentWorkout.exercises[exIdx];
                    if (!ex) return;
                    const lastSet = ex.sets[ex.sets.length - 1];
                    ex.sets.push({
                        setNumber: ex.sets.length + 1,
                        weight: lastSet ? lastSet.weight : '',
                        weightUnit: data.settings.weightUnit || 'kg',
                        reps: lastSet ? lastSet.reps : '',
                        note: ''
                    });
                    renderWorkout();
                    showToast('已添加一组');
                };
            });

            // 重量 / 次数 输入变化
            document.querySelectorAll('.set-weight').forEach(input => {
                input.onchange = function() {
                    const exIdx = parseInt(this.dataset.exidx);
                    const setIdx = parseInt(this.dataset.setidx);
                    const ex = currentWorkout.exercises[exIdx];
                    if (!ex || !ex.sets[setIdx]) return;
                    ex.sets[setIdx].weight = this.value;
                    saveData();
                    updateOverviewOnly();
                };
            });
            document.querySelectorAll('.set-reps').forEach(input => {
                input.onchange = function() {
                    const exIdx = parseInt(this.dataset.exidx);
                    const setIdx = parseInt(this.dataset.setidx);
                    const ex = currentWorkout.exercises[exIdx];
                    if (!ex || !ex.sets[setIdx]) return;
                    ex.sets[setIdx].reps = this.value;
                    saveData();
                    updateOverviewOnly();
                };
            });

            // 备注
            document.getElementById('workoutNote').onchange = function() {
                currentWorkout.note = this.value;
                saveData();
            };
            document.getElementById('workoutNote').oninput = function() {
                currentWorkout.note = this.value;
                saveData();
            };
        }

        function updateOverviewOnly() {
            let setCount = 0,
                volume = 0;
            currentWorkout.exercises.forEach(ex => {
                (ex.sets || []).forEach(s => {
                    setCount++;
                    const w = parseFloat(s.weight) || 0;
                    const r = parseInt(s.reps) || 0;
                    volume += w * r;
                });
            });
            document.getElementById('exerciseCount').textContent = currentWorkout.exercises.length;
            document.getElementById('setCount').textContent = setCount;
            document.getElementById('totalVolume').innerHTML = `${Math.round(volume)} <span class="unit">kg</span>`;
        }

        // ---------- 渲染：历史 ----------
        function renderHistory() {
            const container = document.getElementById('historyList');
            const workouts = data.workouts.slice().reverse().slice(0, 3);

            if (workouts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding:12px 0;">
                        <div class="text">还没有训练记录，开始第一次训练吧 💪</div>
                    </div>
                `;
                return;
            }

            let html = '';
            workouts.forEach((w, i) => {
                const vol = calcVolume(w);
                const sets = totalSets(w);
                const exNames = (w.exercises || []).map(e => e.exerciseName).join(' + ') || '训练';
                const dateStr = formatDate(w.date);
                const weekDay = getWeekday(w.date);
                html += `
                    <div class="history-item" data-wid="${w.id}">
                        <div class="clickable" data-wid="${w.id}">
                            <div class="left">
                                <div class="h-name">${exNames}</div>
                                <div class="h-date">${dateStr} ${weekDay}</div>
                            </div>
                            <div class="right">
                                <div class="h-volume">${Math.round(vol)} <span class="unit">kg</span></div>
                                <div class="h-detail">${(w.exercises||[]).length} 个动作 · ${sets} 组</div>
                            </div>
                        </div>
                        <div class="delete-wrapper">
                            <button class="btn-delete-history" data-action="delete-history" data-wid="${w.id}">🗑️</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // 查看详情（点击主体部分）
            container.querySelectorAll('.clickable').forEach(el => {
                el.onclick = function(e) {
                    e.stopPropagation();
                    const wid = this.dataset.wid;
                    showWorkoutDetail(wid);
                };
            });

            // 删除按钮
            container.querySelectorAll('[data-action="delete-history"]').forEach(btn => {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    const wid = this.dataset.wid;
                    deleteWorkout(wid);
                };
            });
        }

        // ---------- 渲染：全部历史 (弹窗) ----------
        function renderAllHistory() {
            const container = document.getElementById('allHistoryList');
            const workouts = data.workouts.slice().reverse();

            if (workouts.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="text">暂无记录</div></div>`;
                return;
            }

            let html = '';
            workouts.forEach(w => {
                const vol = calcVolume(w);
                const sets = totalSets(w);
                const exNames = (w.exercises || []).map(e => e.exerciseName).join(' + ') || '训练';
                const dateStr = formatDate(w.date);
                const weekDay = getWeekday(w.date);
                html += `
                    <div class="history-select-item" data-wid="${w.id}" style="cursor:default; padding:12px 14px; display:flex; justify-content:space-between; align-items:center;">
                        <div style="flex:1; cursor:pointer;" class="all-history-clickable" data-wid="${w.id}">
                            <div class="hs-name">${exNames}</div>
                            <div class="hs-date">${dateStr} ${weekDay} · ${(w.exercises||[]).length}个动作 · ${sets}组</div>
                            <div class="hs-detail">${Math.round(vol)} kg</div>
                        </div>
                        <div style="margin-left:8px;">
                            <button class="btn-delete-history-sm" data-action="delete-history-all" data-wid="${w.id}">🗑️</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // 点击查看详情
            container.querySelectorAll('.all-history-clickable').forEach(el => {
                el.onclick = function(e) {
                    e.stopPropagation();
                    const wid = this.dataset.wid;
                    closeAllModals();
                    showWorkoutDetail(wid);
                };
            });

            // 删除按钮
            container.querySelectorAll('[data-action="delete-history-all"]').forEach(btn => {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    const wid = this.dataset.wid;
                    deleteWorkout(wid);
                };
            });
        }

        // ---------- 显示训练详情 ----------
        function showWorkoutDetail(wid) {
            const w = data.workouts.find(w => w.id === wid);
            if (!w) return;
            document.getElementById('detailTitle').textContent = `📋 ${formatDate(w.date)} ${getWeekday(w.date)}`;
            let html = `
                <div style="margin-bottom:10px; color:#8a9a9a; font-size:13px;">
                    开始 ${formatTime(w.startedAt)} · 总训练量 ${Math.round(calcVolume(w))} kg · ${totalSets(w)} 组
                    ${w.note ? `<br>📝 ${w.note}` : ''}
                </div>
            `;
            (w.exercises || []).forEach(ex => {
                html += `<div style="margin-top:12px; font-weight:600; color:#2B4450;">${ex.exerciseName} ${ex.isCustom ? '✧' : ''}</div>`;
                (ex.sets || []).forEach(s => {
                    const wVal = s.weight || '自重';
                    html += `<div style="padding:2px 0 2px 12px; font-size:14px; color:#4a5a5a;">${s.setNumber}. ${wVal} ${s.weightUnit || 'kg'} × ${s.reps || 0}</div>`;
                });
            });
            document.getElementById('detailContent').innerHTML = html;
            document.getElementById('modalWorkoutDetail').classList.add('show');
        }

        // ---------- 添加动作弹窗 ----------
        function renderExercisePicker(filter = 'all') {
            const container = document.getElementById('exercisePickerList');
            let list = [];

            if (filter === 'recent') {
                // 从最近3次训练中提取
                const recentIds = new Set();
                const recentWorkouts = data.workouts.slice().reverse().slice(0, 5);
                recentWorkouts.forEach(w => {
                    (w.exercises || []).forEach(ex => {
                        recentIds.add(ex.exerciseId);
                    });
                });
                list = data.exercises.filter(e => recentIds.has(e.id));
                if (list.length === 0) list = data.exercises.slice();
            } else {
                list = data.exercises.slice();
            }

            // 搜索过滤
            const searchVal = document.getElementById('searchExercise').value.trim().toLowerCase();
            if (searchVal) {
                list = list.filter(e => e.name.toLowerCase().includes(searchVal));
            }

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding:16px 0;">
                        <div class="text">没有找到动作，试试创建自定义</div>
                    </div>
                `;
                return;
            }

            let html = '';
            list.forEach(ex => {
                const inCurrent = currentWorkout.exercises.some(e => e.exerciseId === ex.id);
                html += `
                    <div class="action-item" data-eid="${ex.id}" style="${inCurrent ? 'opacity:0.4;' : ''}">
                        <span class="name">${ex.name} ${ex.isCustom ? '✧' : ''}</span>
                        <span class="tag">${inCurrent ? '已添加' : '选择'}</span>
                    </div>
                `;
            });
            container.innerHTML = html;

            container.querySelectorAll('.action-item').forEach(item => {
                item.onclick = function() {
                    const eid = this.dataset.eid;
                    const ex = data.exercises.find(e => e.id === eid);
                    if (!ex) return;
                    // 检查是否已存在
                    if (currentWorkout.exercises.some(e => e.exerciseId === eid)) {
                        showToast('该动作已在当前训练中');
                        return;
                    }
                    currentWorkout.exercises.push({
                        exerciseId: ex.id,
                        exerciseName: ex.name,
                        isCustom: ex.isCustom || false,
                        sets: [{ setNumber: 1, weight: '', weightUnit: data.settings.weightUnit || 'kg', reps: '',
                            note: '' }]
                    });
                    renderWorkout();
                    closeAllModals();
                    showToast(`已添加「${ex.name}」`);
                };
            });
        }

        // ---------- 复用历史 ----------
        function renderReuseList() {
            const container = document.getElementById('reuseHistoryList');
            const workouts = data.workouts.slice().reverse();

            if (workouts.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="text">还没有历史训练可以复用</div></div>`;
                return;
            }

            let html = '';
            workouts.forEach(w => {
                const vol = calcVolume(w);
                const sets = totalSets(w);
                const exNames = (w.exercises || []).map(e => e.exerciseName).join(' + ') || '训练';
                const dateStr = formatDate(w.date);
                html += `
                    <div class="history-select-item" data-wid="${w.id}">
                        <div>
                            <div class="hs-name">${exNames}</div>
                            <div class="hs-date">${dateStr} · ${(w.exercises||[]).length}个动作 · ${sets}组</div>
                        </div>
                        <div class="hs-detail">${Math.round(vol)} kg</div>
                    </div>
                `;
            });
            container.innerHTML = html;

            container.querySelectorAll('.history-select-item').forEach(item => {
                item.onclick = function() {
                    const wid = this.dataset.wid;
                    const source = data.workouts.find(w => w.id === wid);
                    if (!source) return;
                    // 复用
                    currentWorkout = {
                        id: generateId(),
                        date: new Date().toISOString().slice(0, 10),
                        startedAt: new Date().toISOString(),
                        completedAt: null,
                        note: `复用自 ${formatDate(source.date)}`,
                        exercises: (source.exercises || []).map(ex => ({
                            exerciseId: ex.exerciseId,
                            exerciseName: ex.exerciseName,
                            isCustom: ex.isCustom || false,
                            sets: (ex.sets || []).map(s => ({
                                setNumber: s.setNumber,
                                weight: s.weight || '',
                                weightUnit: s.weightUnit || data.settings.weightUnit || 'kg',
                                reps: s.reps || '',
                                note: s.note || ''
                            }))
                        }))
                    };
                    renderWorkout();
                    closeAllModals();
                    showToast('已复用历史训练，可修改后保存');
                };
            });
        }

        // ---------- Toast ----------
        let toastTimer = null;

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.remove('show');
            }, 2200);
        }

        // ---------- 弹窗控制 ----------
        function closeAllModals() {
            document.querySelectorAll('.modal-overlay').forEach(el => el.classList.remove('show'));
        }

        // ---------- 完成训练 ----------
        function completeWorkout() {
            if (currentWorkout.exercises.length === 0) {
                showToast('至少添加一个动作才能完成训练');
                return;
            }
            // 检查是否有空组
            let hasEmpty = false;
            currentWorkout.exercises.forEach(ex => {
                (ex.sets || []).forEach(s => {
                    if (!s.reps || s.reps.trim() === '') hasEmpty = true;
                });
            });
            if (hasEmpty) {
                if (!confirm('存在未填写次数的组，确定要保存吗？')) return;
            }

            // 补全重量默认值
            currentWorkout.exercises.forEach(ex => {
                (ex.sets || []).forEach(s => {
                    if (!s.weight || s.weight.trim() === '') {
                        s.weight = '';
                    }
                    if (!s.reps || s.reps.trim() === '') {
                        s.reps = '0';
                    }
                });
            });

            currentWorkout.completedAt = new Date().toISOString();
            // 保存到历史
            const saved = JSON.parse(JSON.stringify(currentWorkout));
            data.workouts.push(saved);
            // 重置当前训练
            currentWorkout = createEmptyWorkout();
            saveData();
            renderWorkout();
            renderHistory();
            showToast('🎉 训练已保存！');
        }

        // ---------- 初始化 ----------
        function init() {
            // 设置日期
            const now = new Date();
            document.getElementById('currentDate').textContent = now.toISOString().slice(0, 10);

            // ---- 确保标准动作始终存在于动作库中（合并逻辑） ----
            const defaultExercises = [
                '卧推', '深蹲', '硬拉', '杠铃划船', '引体向上',
                '坐姿推肩', '哑铃弯举', '绳索下压', '腿举', '俯身飞鸟',
                '高位下拉', '坐姿划船', '上斜卧推', '双杠臂屈伸', '箭步蹲'
            ];
            let addedCount = 0;
            defaultExercises.forEach(name => {
                if (!data.exercises.some(e => e.name.toLowerCase() === name.toLowerCase())) {
                    data.exercises.push({
                        id: generateId(),
                        name: name,
                        isCustom: false,
                        createdAt: new Date().toISOString()
                    });
                    addedCount++;
                }
            });
            if (addedCount > 0) {
                saveData();
                console.log(`✅ 已补充 ${addedCount} 个标准动作到动作库`);
            }

            // 从历史训练中补充遗漏的动作（以防万一）
            data.workouts.forEach(w => {
                (w.exercises || []).forEach(ex => {
                    if (!data.exercises.some(e => e.id === ex.exerciseId)) {
                        data.exercises.push({
                            id: ex.exerciseId || generateId(),
                            name: ex.exerciseName,
                            isCustom: ex.isCustom || false,
                            createdAt: new Date().toISOString()
                        });
                    }
                });
            });
            saveData();

            // 渲染
            renderWorkout();
            renderHistory();

            // ----- 事件绑定 -----

            // 添加动作
            document.getElementById('btnAddExercise').onclick = function() {
                document.getElementById('searchExercise').value = '';
                renderExercisePicker('all');
                document.getElementById('modalAddExercise').classList.add('show');
            };

            // 关闭添加动作
            document.getElementById('modalCloseAdd').onclick = closeAllModals;
            document.getElementById('modalAddExercise').onclick = function(e) {
                if (e.target === this) closeAllModals();
            };

            // 搜索过滤
            document.getElementById('searchExercise').oninput = function() {
                renderExercisePicker('all');
            };
            document.getElementById('filterRecent').onclick = function() {
                renderExercisePicker('recent');
            };
            document.getElementById('filterAll').onclick = function() {
                renderExercisePicker('all');
            };

            // 创建自定义动作
            document.getElementById('btnCreateNewAction').onclick = function() {
                document.getElementById('modalAddExercise').classList.remove('show');
                document.getElementById('newExerciseName').value = '';
                document.getElementById('modalCreateExercise').classList.add('show');
            };
            document.getElementById('modalCloseCreate').onclick = closeAllModals;
            document.getElementById('modalCreateExercise').onclick = function(e) {
                if (e.target === this) closeAllModals();
            };
            document.getElementById('btnCancelCreate').onclick = closeAllModals;

            document.getElementById('btnSaveCreate').onclick = function() {
                const name = document.getElementById('newExerciseName').value.trim();
                if (!name) {
                    showToast('请输入动作名称');
                    return;
                }
                // 检查重复
                if (data.exercises.some(e => e.name.toLowerCase() === name.toLowerCase())) {
                    showToast('该动作已存在');
                    return;
                }
                const id = ensureExercise(name, true);
                // 添加到当前训练
                currentWorkout.exercises.push({
                    exerciseId: id,
                    exerciseName: name,
                    isCustom: true,
                    sets: [{ setNumber: 1, weight: '', weightUnit: data.settings.weightUnit || 'kg', reps: '', note: '' }]
                });
                renderWorkout();
                closeAllModals();
                showToast(`已创建并添加「${name}」`);
            };

            // 回车创建
            document.getElementById('newExerciseName').onkeydown = function(e) {
                if (e.key === 'Enter') document.getElementById('btnSaveCreate').click();
            };

            // 复用
            document.getElementById('btnReuse').onclick = function() {
                renderReuseList();
                document.getElementById('modalReuse').classList.add('show');
            };
            document.getElementById('modalCloseReuse').onclick = closeAllModals;
            document.getElementById('modalReuse').onclick = function(e) {
                if (e.target === this) closeAllModals();
            };

            // 全部历史
            document.getElementById('btnViewAll').onclick = function() {
                renderAllHistory();
                document.getElementById('modalAllHistory').classList.add('show');
            };
            document.getElementById('modalCloseAllHistory').onclick = closeAllModals;
            document.getElementById('modalAllHistory').onclick = function(e) {
                if (e.target === this) closeAllModals();
            };

            // 训练详情关闭
            document.getElementById('modalCloseDetail').onclick = closeAllModals;
            document.getElementById('modalWorkoutDetail').onclick = function(e) {
                if (e.target === this) closeAllModals();
            };

            // 完成训练
            document.getElementById('btnComplete').onclick = function() {
                if (currentWorkout.exercises.length === 0) {
                    showToast('至少添加一个动作');
                    return;
                }
                // 确认
                const total = totalSets(currentWorkout);
                const vol = calcVolume(currentWorkout);
                if (!confirm(`完成训练？共 ${currentWorkout.exercises.length} 个动作，${total} 组，总训练量 ${Math.round(vol)} kg`)) return;
                completeWorkout();
            };

            // 底部导航（简单切换视图）
            document.querySelectorAll('.nav-item').forEach(item => {
                item.onclick = function() {
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    this.classList.add('active');
                    const tab = this.dataset.tab;
                    if (tab === 'workout') {
                        document.getElementById('scrollContent').scrollTop = 0;
                    } else if (tab === 'library') {
                        // 打开动作库弹窗
                        document.getElementById('searchExercise').value = '';
                        renderExercisePicker('all');
                        document.getElementById('modalAddExercise').classList.add('show');
                    } else if (tab === 'stats') {
                        showToast('📊 数据统计功能开发中');
                    } else if (tab === 'settings') {
                        showToast('⚙️ 设置功能开发中');
                    }
                };
            });

            // 自动保存草稿
            setInterval(() => {
                saveData();
            }, 30000);

            // 页面关闭前保存
            window.addEventListener('beforeunload', () => {
                saveData();
            });

            // 键盘快捷键：Enter 在搜索框触发选择
            document.getElementById('searchExercise').onkeydown = function(e) {
                if (e.key === 'Enter') {
                    const first = document.querySelector('#exercisePickerList .action-item');
                    if (first) first.click();
                }
            };

            console.log('🏋️ workout-diary 已启动！');
            console.log(`📊 历史训练: ${data.workouts.length} 条`);
            console.log(`📚 动作库: ${data.exercises.length} 个 (含标准动作)`);
        }

        // ---------- 启动 ----------
        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
